[package]
name = "hash-timestamp"
version = "4.0.0"
description = "A smart contract that fixes the timestamp of a hash"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hash_timestamp"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
debug-logs = []
idl-build = ["anchor-lang/idl-build"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
